# Puerto del servidor (también se puede cambiar con la variable de entorno PORT).
server.port=${PORT:8080}

# Base de datos (HU: guardar usuarios, objetos, puntos y categorías).
# Por defecto: H2 en archivo, dentro de data/ (se ejecuta siempre desde esta carpeta).
spring.datasource.url=${FYB_DB_URL:jdbc:h2:file:./data/fyb-db;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${FYB_DB_USER:sa}
spring.datasource.password=${FYB_DB_PASSWORD:}

# Crea/ajusta las tablas solas al arrancar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Cada cuántos milisegundos se copian a la base los cambios que hacen los servicios actuales.
fyb.db.sync-ms=30000
